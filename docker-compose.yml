services:
  db:
    image: mariadb:latest
    ports:
      - "3306:3306"
    environment:
      - MARIADB_ROOT_PASSWORD=${MARIADB_ROOT_PASSWORD:-root-password}
      - MARIADB_DATABASE=mail_catcher
    volumes:
      - mysql-data:/var/lib/mysql
    restart: always

  smtp-service:
    build: ./smtp-service
    ports:
      - "587:25"
    depends_on:
      - db
    environment:
      - DATABASE_URL=mysql://root:${MARIADB_ROOT_PASSWORD:-root-password}@db:3306/mail_catcher
      - UPLOAD_DIR=/app/data/attachments
      - SSL_KEY=${SSL_KEY:-/etc/letsencrypt/live/example.com/privkey.pem}
      - SSL_CERT=${SSL_CERT:-/etc/letsencrypt/live/example.com/fullchain.pem}
    volumes:
      - attachments-data:/app/data/attachments
      - /etc/letsencrypt:/etc/letsencrypt:ro
    restart: always

  web:
    build: ./web
    ports:
      - "3000:3000"
    depends_on:
      - db
    environment:
      - DATABASE_URL=mysql://root:${MARIADB_ROOT_PASSWORD:-root-password}@db:3306/mail_catcher
      - UPLOAD_DIR=/app/data/attachments
      - AUTH_SECRET=${AUTH_SECRET:-very-secret-key}
      - NEXTAUTH_URL=${NEXTAUTH_URL:-https://example.com}
    volumes:
      - attachments-data:/app/data/attachments
    restart: always

volumes:
  mysql-data:
  attachments-data:
