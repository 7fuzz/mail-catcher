services:
  db:
    image: mariadb:latest
    ports:
      - "3306:3306"
    environment:
      - MARIADB_ROOT_PASSWORD=root
      - MARIADB_DATABASE=mail_catcher
    volumes:
      - mysql-data:/var/lib/mysql
    restart: always

  smtp-service:
    build: ./smtp-service
    ports:
      - "2525:25"
    depends_on:
      - db
    environment:
      - DATABASE_URL=mysql://root:root@db:3306/mail_catcher
      - UPLOAD_DIR=/app/data/attachments
    volumes:
      - attachments-data:/app/data/attachments
    restart: always

  web:
    build: ./web
    ports:
      - "3000:3000"
    depends_on:
      - db
    environment:
      - DATABASE_URL=mysql://root:root@db:3306/mail_catcher
      - UPLOAD_DIR=/app/data/attachments
      - AUTH_SECRET=very-secret-key-change-this-in-production
      - NEXTAUTH_URL=http://localhost:3000
    volumes:
      - attachments-data:/app/data/attachments
    restart: always

volumes:
  mysql-data:
  attachments-data:
